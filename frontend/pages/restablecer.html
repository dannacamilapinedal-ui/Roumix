<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crea una contraseña nueva para tu cuenta de Roumix.">
  <meta name="robots" content="noindex">
  <!-- El enlace del correo trae un token: no se envía a otros sitios como "Referer" -->
  <meta name="referrer" content="no-referrer">
  <title>Crear contraseña nueva — Roumix</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="page-login">
  <header class="main-header login-header entrada-arriba">
    <div class="header-inner">
      <div class="header-left">
        <a href="../index.html" class="logo">
          <span class="logo-text">roumix</span><span class="logo-dot">.</span>
        </a>
      </div>
    </div>
  </header>

  <main class="restablecer-contenedor">
    <section class="restablecer-tarjeta entrada-arriba" style="animation-delay: 0.1s;" aria-labelledby="restablecer-titulo">
      <h1 id="restablecer-titulo">Crea una contraseña nueva</h1>
      <p class="restablecer-ayuda" id="restablecer-ayuda">Usa al menos 8 caracteres. Después de guardarla, todas tus sesiones abiertas se cerrarán.</p>

      <form id="form-restablecer" class="auth-form-card" novalidate>
        <div class="auth-field-group">
          <label for="nueva-password" class="auth-label">Contraseña nueva</label>
          <input type="password" id="nueva-password" class="auth-input" autocomplete="new-password" minlength="8" maxlength="72" required>
        </div>

        <div class="auth-field-group">
          <label for="confirmar-password" class="auth-label">Repite la contraseña</label>
          <input type="password" id="confirmar-password" class="auth-input" autocomplete="new-password" minlength="8" maxlength="72" required>
        </div>

        <label class="auth-check restablecer-mostrar">
          <input type="checkbox" id="mostrar-password">
          <span>Mostrar contraseñas</span>
        </label>

        <p id="restablecer-mensaje" class="pub-mensaje" role="alert" aria-live="polite" hidden></p>

        <button type="submit" class="btn-auth-primary" id="btn-restablecer">Guardar contraseña</button>
      </form>

      <a href="../index.html" class="auth-footer-link restablecer-volver" id="link-acceso">← Volver a iniciar sesión</a>
    </section>
  </main>

  <script src="../js/app.js"></script>
  <script src="../js/api.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("form-restablecer");
      const mensaje = document.getElementById("restablecer-mensaje");
      const boton = document.getElementById("btn-restablecer");
      const inputNueva = document.getElementById("nueva-password");
      const inputConfirmar = document.getElementById("confirmar-password");

      function mostrar(texto, tipo) {
        mensaje.textContent = texto;
        mensaje.className = `pub-mensaje ${tipo === "exito" ? "pub-mensaje-exito" : "pub-mensaje-error"}`;
        mensaje.hidden = false;
      }

      // Supabase devuelve el token de recuperación (o el error) en el #hash del enlace.
      // Se guarda solo en memoria y se borra de la barra de direcciones de inmediato.
      const datos = new URLSearchParams(window.location.hash.slice(1));
      history.replaceState(null, "", window.location.pathname);
      const token = datos.get("type") === "recovery" ? datos.get("access_token") : null;

      if (!token) {
        form.hidden = true;
        document.getElementById("restablecer-ayuda").hidden = true;
        const motivo = datos.get("error_code") === "otp_expired" || /expired/i.test(datos.get("error_description") || "")
          ? "El enlace ya expiró o ya se usó."
          : "Este enlace no es válido.";
        mostrar(`${motivo} Pide uno nuevo desde "¿Olvidaste tu contraseña?" en la página de inicio.`, "error");
        return;
      }

      document.getElementById("mostrar-password").addEventListener("change", (e) => {
        const tipo = e.target.checked ? "text" : "password";
        inputNueva.type = tipo;
        inputConfirmar.type = tipo;
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const nueva = inputNueva.value;
        if (nueva.length < 8) return mostrar("La contraseña debe tener al menos 8 caracteres.", "error");
        if (nueva !== inputConfirmar.value) return mostrar("Las contraseñas no coinciden.", "error");

        boton.disabled = true;
        boton.textContent = "Guardando…";
        try {
          const respuesta = await RoumixAPI.restablecerContrasena(token, nueva);
          // Cualquier sesión guardada en este navegador quedó cerrada en el servidor
          RoumixStorage.limpiarSesion();
          form.hidden = true;
          mostrar(`${respuesta} Te llevaremos al inicio de sesión…`, "exito");
          setTimeout(() => window.location.replace("../index.html"), 3500);
        } catch (error) {
          mostrar(error.status === 401
            ? 'El enlace expiró o ya se usó. Pide uno nuevo desde "¿Olvidaste tu contraseña?" en la página de inicio.'
            : error.message, "error");
          boton.disabled = false;
          boton.textContent = "Guardar contraseña";
        }
      });
    });
  </script>
</body>
</html>
